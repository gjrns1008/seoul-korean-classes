name: Refresh Seoul Korean classes page
on:
  schedule:
    - cron: '0 11 * * *'     # 매일 20:00 KST (UTC 11:00)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch portal list and rebuild index.html
        run: python build.py index.html
      - name: Commit if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html programs.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Refresh Korean classes $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"; git push; fi
